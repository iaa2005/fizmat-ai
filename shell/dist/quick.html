<!doctype html>
<meta charset="utf-8">
<title>Fizmat</title>
<!-- Строка быстрого вопроса по щелчку на значок в трее (src-tauri/src/tray.rs): появляется из
     размытия, Enter — новый чат на fizmat.ai моделью по умолчанию, Esc — спрятать. -->
<style>
    @font-face { font-family: Manrope; src: local("Manrope"); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font: 16px/1.4 Manrope, "Segoe UI", system-ui, sans-serif; }
    .bar { width: 620px; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 18px;
        border-radius: 16px; background: rgba(38, 37, 34, .92); color: #f5f4ef; border: 1px solid rgba(255, 255, 255, .09);
        box-shadow: 0 14px 40px rgba(0, 0, 0, .35); backdrop-filter: blur(18px); }
    @media (prefers-color-scheme: light) {
        .bar { background: rgba(250, 249, 245, .94); color: #1f1e1d; border-color: rgba(0, 0, 0, .08); box-shadow: 0 14px 40px rgba(0, 0, 0, .18); }
        input::placeholder { color: #8a877f; }
    }
    .bar.appear { animation: appear .26s cubic-bezier(.2, .8, .2, 1); }
    @keyframes appear {
        from { opacity: 0; filter: blur(10px); transform: scale(.97) translateY(6px); }
        to { opacity: 1; filter: blur(0); transform: none; }
    }
    svg.logo { height: 15px; width: auto; flex: none; color: inherit; opacity: .9; }
    input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; font-size: 16.5px; }
    input::placeholder { color: #a3a09a; }
</style>

    <input id="q" placeholder="Чем помочь?" aria-label="Вопрос в новый чат">
</form>
<script>
    const bar = document.getElementById('bar');
    const q = document.getElementById('q');
    const invoke = (cmd, args) => window.__TAURI__?.core?.invoke(cmd, args);

    window.fzAppear = () => {
        bar.classList.remove('appear');
        void bar.offsetWidth;
        bar.classList.add('appear');
        q.focus();
        q.select();
    };

    bar.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = q.value.trim();
        if (!text) return;
        try { await invoke('quick_ask', { text }); q.value = ''; } catch (err) { q.placeholder = String(err); }
    });
    addEventListener('keydown', (e) => { if (e.key === 'Escape') invoke('quick_hide'); });
    addEventListener('focus', () => q.focus());
    window.fzAppear();
</script>
